name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Inspect APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)

          {
            echo "=== FILE ==="
            ls -la $APK
            echo ""
            echo "=== BUILD TOOLS ==="
            echo "$BT"
            echo ""
            echo "=== BADGING ==="
            $BT/aapt2 dump badging $APK | head -25
            echo ""
            echo "=== SIGNATURES ==="
            $BT/apksigner verify --verbose --print-certs $APK
          } > apk-report.txt 2>&1

          # Show it in the run summary page so it needs no clicking around,
          # and keep the file so it can be downloaded as an artifact.
          cat apk-report.txt
          {
            echo '## APK report'
            echo '```'
            cat apk-report.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-ota-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-report.txt
